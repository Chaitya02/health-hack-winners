[project]
name = "tingting-backend"
version = "0.1.0"
description = "Ting-ting AI call bell router — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "boto3>=1.35",
  "mangum>=0.19",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "moto[dynamodb]>=5.0",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # multilingual lexicons legitimately contain confusable chars

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/safety/lexicon.py" = ["E501"]  # long regex alternations / multilingual phrases
"app/classifier/prompt.py" = ["E501"]  # few-shot JSON examples
"app/classifier/confirmations.py" = ["E501"]  # multilingual patient templates
"app/intake.py" = ["E501"]  # keyword pattern alternations

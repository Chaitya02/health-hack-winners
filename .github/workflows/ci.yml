name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . ../scripts && uv run ruff format --check . ../scripts
      - name: pytest
        run: uv run pytest
      - name: eval (mock classifier, safety gate)
        run: uv run --project backend python scripts/eval.py --mode mock --no-report --gate
        if: hashFiles('scripts/eval.py') != ''
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.4
        ports: ["8001:8000"]
    env:
      DYNAMODB_ENDPOINT_URL: http://localhost:8001
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen
      - name: start backend
        run: cd backend && (uv run uvicorn app.asgi:app --port 8000 > ../backend.log 2>&1 &)
      - run: for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
      - run: uv run --project backend python scripts/seed.py
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: start frontend
        run: cd frontend && (npx vite --port 5173 > ../frontend.log 2>&1 &)
      - run: for i in $(seq 1 30); do curl -fs localhost:5173 >/dev/null && break; sleep 1; done
      - name: playwright (a)–(e)
        run: cd frontend && MAX_LATENCY_MS=1500 npx playwright test --reporter=line
      - if: failure()
        run: tail -50 backend.log frontend.log

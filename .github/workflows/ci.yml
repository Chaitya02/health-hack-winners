name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pytest
        run: uv run pytest
      - name: eval (mock classifier, safety gate)
        run: uv run --project backend python scripts/eval.py --mode mock --no-report --gate
        if: hashFiles('scripts/eval.py') != ''
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
